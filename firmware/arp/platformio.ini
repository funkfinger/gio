; PlatformIO project for the gio arp firmware.
; See docs/decisions.md §2 (toolchain) and docs/stories/ for the roadmap.

[platformio]
default_envs = seeed-xiao-rp2350

[env:seeed-xiao-rp2350]
; TOOLCHAIN PINS — platform AND framework are both pinned to exact, immutable
; refs so a clean rebuild can never silently change the toolchain underneath us.
;
; 2026-05-23: builds against the previous framework pin (4.4.0) silently began
; producing UF2s that don't boot on the XIAO RP2350 — USB never enumerates, no
; serial, OLED dark; cost ~hours + a desoldered XIAO to isolate. The platform
; line had also been on the bare branch head (free to move under us). Both are
; now locked:
;
;   platform  #79ce473…  platform-raspberrypi 1.19.0+sha.79ce473 — the exact
;                        commit verified to build AND boot (develop head as of
;                        2026-05-24, pinned by SHA so branch moves don't matter).
;   framework #5.6.0     arduino-pico 5.6.0 + its matching picotool/openocd/
;                        pioasm tools, so those can't drift independently.
;
; Bump BOTH deliberately and verify a clean flash BUILDS AND BOOTS (not just
; compiles) before committing — an earlier tag-pin attempt used a ref that did
; not exist and broke the build. The platform must still support per-pin
; `analogWriteFreq(pin, freq)` — decisions.md §11, Story 003.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#5.6.0
board = seeed_xiao_rp2350
framework = arduino
monitor_speed = 115200
; Exclude the smoke-test AND minimal-test entrypoints from the production
; build — they each have their own setup()/loop() that would collide with
; main.cpp at link time.
build_src_filter = +<*> -<main_smoketest.cpp> -<main_minimal.cpp>
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit NeoPixel
    ; paulstoffregen/Encoder removed during Story 002 (AVR-only). Replaced with
    ; mathertel/RotaryEncoder in Story 007 — RP2350-compatible, polling-based.
    mathertel/RotaryEncoder
    ; Story 012 platform pivot — SPI DAC + ADC. Both Rob Tillaart libs (MIT).
    robtillaart/DAC8552
    robtillaart/MCP_ADC
; On-device tests deferred; pure-logic modules tested on host via [env:native]
test_ignore = *

; Smoke-test build: swaps src/main.cpp for src/main_smoketest.cpp via build_src_filter.
; Use this env to validate Story 012 SPI bring-up + outputs/inputs HAL on the bench
; without disturbing the production arp firmware. Run:
;     pio run -d firmware/arp -e seeed-xiao-rp2350-smoketest --target upload
;     pio device monitor -d firmware/arp -e seeed-xiao-rp2350-smoketest
[env:seeed-xiao-rp2350-smoketest]
extends = env:seeed-xiao-rp2350
build_src_filter = +<*> -<main.cpp> -<main_minimal.cpp> +<main_smoketest.cpp>
build_flags = -DGIO_SMOKE_TEST

; Minimal hello-world: Serial only, no peripherals. Diagnoses XIAO boot/USB
; issues by ruling out smoke-test setup() as the cause. Run:
;     pio run -d firmware/arp -e seeed-xiao-rp2350-minimal --target upload
[env:seeed-xiao-rp2350-minimal]
extends = env:seeed-xiao-rp2350
build_src_filter = +<*> -<main.cpp> -<main_smoketest.cpp> +<main_minimal.cpp>
lib_deps =
build_flags = -DGIO_MINIMAL_TEST

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17 -Wall -Wextra
